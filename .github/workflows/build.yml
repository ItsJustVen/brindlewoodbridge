name: Build plugin

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: BrindleWoodBridge
          path: target/*.jar
          if-no-files-found: error

      - name: Publish jar to build-output branch
        run: |
          set -e
          JAR=$(ls target/*.jar | grep -v original | head -n1)
          rm -rf /tmp/publish
          mkdir /tmp/publish
          cp "$JAR" /tmp/publish/BrindleWoodBridge.jar
          cd /tmp/publish
          git init -q
          git checkout -q -b build-output
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add BrindleWoodBridge.jar
          git commit -q -m "Build output from ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin build-output
